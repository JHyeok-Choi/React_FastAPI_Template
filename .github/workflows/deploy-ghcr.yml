name: Build and Push Docker Image to GHCR

on:
  push:
    branches:
      - main

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      # 1. ⭐️ Docker 메타데이터 설정을 통해 대문자 계정명을 자동으로 소문자로 변환합니다.
      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=raw,value=latest
            type=sha

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 2. ⭐️ 변환된 태그를 사용하여 이미지를 안전하게 빌드 및 푸시합니다.
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # 3. ⭐️ 오래된 비정식/Untagged 이미지 자동 청소 (용량 관리)
      - name: Delete old images
        uses: actions/delete-package-versions@v5
        with:
          package-name: '${{ github.event.repository.name }}' # 청소할 패키지명
          package-type: 'container'
          min-versions-to-keep: 3 # ⭐️ 최신 3개 버전만 남기고 모두 삭제
          delete-only-unreferenced-versions: true # ⭐️ 태그가 없는(Untagged) 이미지만 골라서 삭제
